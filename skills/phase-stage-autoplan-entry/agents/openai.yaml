interface:
  display_name: "Phase/Stage Autoplan"
  short_description: "Collect task context and write adaptive phase/stage plans."
  default_prompt: "Use $phase-stage-autoplan-entry to collect the target task context, scan the project, and generate an adaptive phase/stage autorun plan under the target project's plans directory. Stay in t0 while doing intake and planning. Generate all phases upfront, detail only the current executable phase, stop in pending approval state, and hand off to $phase-stage-autorun-protocol only after explicit user confirmation."

policy:
  allow_implicit_invocation: true
