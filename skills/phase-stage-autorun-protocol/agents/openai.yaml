interface:
  display_name: "Phase/Stage Autorun"
  short_description: "Auto-advance long staged tasks with built-in audit and repair."
  default_prompt: "Use $phase-stage-autorun-protocol to keep this long-running phase/stage plan moving automatically. Continue through the planned stages without asking for routine supervision, use $generator-critic-verification-loop after each completed stage to audit and repair the result before advancing, and stop only for real hard blockers, missing plan detail, or unsafe actions."

policy:
  allow_implicit_invocation: true
